# Hệ thống đặt lịch hẹn – toàn bộ dịch vụ chạy bằng một lệnh: docker compose up -d --build
#
# Mạng:
#   edge   – chỉ Nginx, publish cổng 80/443 ra máy chủ
#   app    – nội bộ (internal): Nginx, backend, worker, PostgreSQL, pgAdmin
#   egress – cho worker gửi email ra Internet
#   monitor – nội bộ (internal): Prometheus, Grafana, cAdvisor, các exporter
name: booking

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  NODE_ENV: production
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:?Thiếu POSTGRES_DB}
  DB_USER: ${APP_DB_USER:?Thiếu APP_DB_USER}
  DB_PASSWORD: ${APP_DB_PASSWORD:?Thiếu APP_DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET}
  PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
  RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}

services:
  # ---------------------------------------------------------------- Reverse proxy + frontend
  nginx:
    <<: *hardening
    build: ./frontend
    image: booking-nginx:1.0.0
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [edge, app, monitor]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  # ---------------------------------------------------------------- API NestJS
  backend:
    <<: *hardening
    build: ./backend
    image: booking-backend:1.0.0
    init: true
    environment:
      <<: *backend-env
      PORT: "3000"
      SERVICE_NAME: backend
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Thiếu ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Thiếu ADMIN_PASSWORD}
      SEED_DEMO: ${SEED_DEMO:-true}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }

  # ---------------------------------------------------------------- Worker: hết hạn lịch chờ, gửi email, nhắc lịch
  worker:
    <<: *hardening
    build: ./backend
    image: booking-backend:1.0.0
    init: true
    command: ["node", "dist/worker.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: worker
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [app, egress]
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  # ---------------------------------------------------------------- PostgreSQL (không publish cổng)
  postgres:
    <<: *hardening
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
      # Dùng cho postgres/init/01-roles.sh khi khởi tạo lần đầu.
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?Thiếu EXPORTER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Entrypoint cần một số quyền để đổi chủ thư mục dữ liệu rồi hạ quyền xuống user postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 128m
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # ---------------------------------------------------------------- pgAdmin (truy cập qua https://localhost/pgadmin/)
  pgadmin:
    <<: *hardening
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Thiếu PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Thiếu PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "30"
      # Mạng app không ra Internet: tắt kiểm tra phiên bản mới và ảnh Gravatar
      # (Gravatar còn làm lộ mã băm email quản trị ra dịch vụ bên ngoài).
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_SHOW_GRAVATAR_IMAGE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    # Chạy bằng uid 5050. Bỏ mọi capability mặc định, chỉ giữ NET_BIND_SERVICE vì tệp
    # /venv/bin/python3 của image được gắn sẵn file capability này (thiếu thì không chạy được).
    # Không bật read_only: entrypoint ghi tệp cấu hình vào /pgadmin4 khi khởi động.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # ================================================================ Giám sát (commit 2)

  # ---------------------------------------------------------------- Prometheus (https://localhost/prometheus/, có basic auth)
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.external-url=${PUBLIC_URL:-https://localhost}/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    cap_drop: [ALL]
    # Cần mạng app để đọc /metrics của backend.
    networks: [monitor, app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/prometheus/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # ---------------------------------------------------------------- Grafana (https://localhost/grafana/)
  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Thiếu GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-https://localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Mạng monitor không ra Internet: không tải plugin khi khởi động.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/booking-containers.json
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [monitor]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # ---------------------------------------------------------------- cAdvisor: metrics từng container
  # Ngoại lệ hardening: cAdvisor phải chạy bằng root để đọc cgroup/Docker của máy chủ.
  # Bù lại: bỏ mọi capability, mọi thư mục gắn read-only, không publish cổng, chỉ ở mạng monitor.
  cadvisor:
    <<: *hardening
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --enable_metrics=cpu,memory,network
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    read_only: true
    cap_drop: [ALL]
    networks: [monitor]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 192M }

  # ---------------------------------------------------------------- Nginx exporter: đọc stub_status (cổng nội bộ 8081)
  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    read_only: true
    cap_drop: [ALL]
    networks: [monitor]
    depends_on: [nginx]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  # ---------------------------------------------------------------- PostgreSQL exporter (user exporter, chỉ quyền pg_monitor)
  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    read_only: true
    cap_drop: [ALL]
    networks: [app, monitor]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

networks:
  edge: {}
  app:
    internal: true
  egress: {}
  monitor:
    internal: true

volumes:
  pgdata:
  pgadmin-data:
  prometheus-data:
  grafana-data:
