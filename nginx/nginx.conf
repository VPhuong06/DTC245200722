# Cấu hình chính của Nginx (image nginx-unprivileged, chạy bằng user không phải root).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Thư mục tạm nằm trong /tmp (tmpfs) vì hệ thống tệp của container là read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Ẩn phiên bản Nginx trong header Server và trang lỗi.
    server_tokens off;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Log truy cập dạng JSON ra stdout để Promtail/Loki thu thập (commit 3).
    # Ghi $uri thay vì $request_uri để không lưu query string (có thể chứa dữ liệu cá nhân).
    log_format json escape=json
        '{'
          '"time":"$time_iso8601",'
          '"level":"info",'
          '"service":"nginx",'
          '"request_id":"$request_id",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$uri",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_status":"$upstream_status",'
          '"upstream_response_time":"$upstream_response_time",'
          '"http_referer":"$http_referer",'
          '"http_user_agent":"$http_user_agent"'
        '}';
    access_log /dev/stdout json;

    # Giới hạn tốc độ theo IP: API nói chung và riêng đăng nhập (chống dò mật khẩu).
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # WebSocket (Grafana Live, commit 2).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
