# Nginx là điểm vào duy nhất: chỉ container này publish cổng ra máy chủ.
#   /          → tệp tĩnh frontend (React build)
#   /api/      → backend NestJS
#   /pgadmin/  → pgAdmin (header X-Script-Name: /pgadmin)

upstream backend {
    server backend:3000;
    keepalive 16;
}

# HTTP (cổng 80 trên máy chủ → 8080 trong container): chuyển hướng toàn bộ sang HTTPS.
server {
    listen 8080 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS (cổng 443 trên máy chủ → 8443 trong container).
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    # Chứng chỉ tự ký sinh bởi scripts/gen-cert.sh (không commit khóa riêng).
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;

    # DNS nội bộ của Docker, dùng cho proxy_pass có biến.
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Tài nguyên có hash trong tên tệp: cache lâu dài.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Ứng dụng một trang (SPA): đường dẫn không phải tệp → index.html, không cache.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Đăng nhập: giới hạn chặt hơn để chống dò mật khẩu (5 yêu cầu/phút, cho phép dồn 5).
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Tài liệu Swagger cần script/style inline.
    location ^~ /api/docs {
        include /etc/nginx/snippets/security-headers-tools.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # pgAdmin chạy dưới đường dẫn con /pgadmin/.
    # Dùng biến + resolver của Docker để Nginx vẫn khởi động được khi pgAdmin chưa sẵn sàng.
    location /pgadmin/ {
        include /etc/nginx/snippets/security-headers-tools.conf;
        set $pgadmin_upstream http://pgadmin:5050;
        rewrite ^/pgadmin/(.*)$ /$1 break;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_pass $pgadmin_upstream;
    }
}

# Cổng nội bộ 8081 (không publish): healthcheck và stub_status cho nginx-prometheus-exporter (commit 2).
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /healthz {
        return 200 "ok\n";
    }

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
